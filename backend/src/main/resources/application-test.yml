spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/finserv_test?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:${DB_MIGRATION_USERNAME:finserv_migration}}
    password: ${TEST_DB_PASSWORD:${DB_MIGRATION_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    user: ${TEST_DB_USERNAME:${DB_MIGRATION_USERNAME:finserv_migration}}
    password: ${TEST_DB_PASSWORD:${DB_MIGRATION_PASSWORD:}}
    clean-disabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

finserv:
  security:
    encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

logging:
  level:
    root: INFO
    com.finserv: DEBUG
