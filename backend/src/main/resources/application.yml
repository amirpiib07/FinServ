server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: finserv-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA & Hibernate Settings (Enforce Strict Financial Invariants)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  # Flyway Migration Settings (Strict Migration Safety)
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

# Actuator Baseline Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# FINServ Domain Security Configuration
finserv:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    encryption-key: ${APP_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
