spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finserv_db?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:finserv_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FinServHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    user: ${DB_MIGRATION_USERNAME:finserv_migration}
    password: ${DB_MIGRATION_PASSWORD:}

# Dev Profile Swagger / OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.finserv: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
